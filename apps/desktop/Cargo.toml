[package]
name = "voice-desktop"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[dependencies]
voice-protocol = { path = "../../crates/protocol" }
slint = "=1.18.1"
tokio.workspace = true
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde_json.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webrtc = "=0.21.1"
async-trait = "0.1"
# Audio da etapa 5 (somente no cliente Windows)
cpal = "=0.16.0"
opus = "=0.4.0"
bytes = "1"

# MVP de tela Windows: captura XCap e quadros JPEG. Futuro: H.264/RTP.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
[target.'cfg(windows)'.dependencies]
xcap = "=0.9.8"
